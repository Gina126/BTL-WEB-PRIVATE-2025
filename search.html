<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kết quả tìm kiếm - RoPhim</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/homepage.css">

    <script src="./js/components.js"></script>
    <script src="./js/config.js"></script>
    <script src="./js/main.js"></script>
</head>
<body>
    <div id="header-placeholder"></div>
    
    <main class="container" style="padding-top: 120px; min-height: 80vh;">
        <div class="section-header">
            <h2 class="section-title" id="searchTitle">Đang tìm kiếm...</h2>
        </div>
        
        <div class="movie-grid" id="searchResultGrid">
            </div>
    </main>

    <div id="footer-placeholder"></div>

    <script>
        const IMAGE_HOST = "https://img.ophim.live/uploads/movies/";

        async function loadSearchResult() {
            const urlParams = new URLSearchParams(window.location.search);
            const keyword = urlParams.get('q'); 
            
            const grid = document.getElementById('searchResultGrid');
            const titleElement = document.getElementById('searchTitle');
            
            if (!keyword) {
                titleElement.innerText = "Vui lòng nhập từ khóa để tìm kiếm";
                grid.innerHTML = "";
                return;
            }

            titleElement.innerText = `KẾT QUẢ TÌM KIẾM: "${keyword.toUpperCase()}"`;
            grid.innerHTML = '<p style="grid-column: 1/-1; padding: 20px;">🔍 Đang tìm phim, đợi xíu nhé...</p>';

            try {
                const response = await fetch(`https://ophim1.com/v1/api/tim-kiem?keyword=${encodeURIComponent(keyword)}&limit=24`);
                const result = await response.json();
                const movies = result.data?.items || [];

                if (movies.length === 0) {
                    grid.innerHTML = `<p style="grid-column: 1/-1; padding: 20px; color: #ff4444;">
                        ❌ Không tìm thấy phim nào khớp với từ khóa "${keyword}".
                    </p>`;
                    return;
                }

                grid.innerHTML = movies.map(movie => {
                    const badge = movie.episode_current || movie.quality || "HD";
                    const thumb = movie.thumb_url.startsWith('http') 
                        ? movie.thumb_url 
                        : `${IMAGE_HOST}${movie.thumb_url}`;

                    return `
                        <div class="movie-card">
                            <div class="badge">${badge}</div>
                            <div class="movie-poster">
                                <img src="${thumb}" alt="${movie.name}" 
                                     onerror="this.src='https://via.placeholder.com/200x300?text=Lỗi+Ảnh'">
                            </div>
                            <div class="movie-info">
                                <h3 title="${movie.name}">${movie.name}</h3>
                                <p>${movie.year || '2024'}</p>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                console.error("Lỗi tìm kiếm:", error);
                grid.innerHTML = `<p style="grid-column: 1/-1; padding: 20px;">⚠️ Lỗi kết nối API. Vui lòng thử lại.</p>`;
            }
        }

        document.addEventListener('DOMContentLoaded', loadSearchResult);
    </script>
</body>
</html>
