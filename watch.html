<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xem Phim - RoPhim</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Styles -->
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/watch.css?v=2">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
    <!-- Header Component -->
    <div id="header-placeholder"></div>

    <!-- Main Content -->
    <main class="watch-page">
        <!-- Watch Header (Back + Title) -->
        <div class="watch-header">
            <a href="javascript:history.back()" class="back-btn">
                <i class="fas fa-chevron-left"></i>
            </a>
            <div class="header-info">
                <span class="header-prefix">Xem phim</span>
                <h1 class="header-title" id="header-movie-title">Đang tải...</h1>
            </div>
        </div>

        <!-- Video Section -->
        <section class="video-section">
            <div class="video-container">
                <iframe id="video-iframe" src="" frameborder="0" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" style="display: none;"></iframe>
                <video id="hls-player" controls preload="auto" style="display: none; width: 100%; height: 100%; background: #000;"></video>
                
                <!-- Floating Quality Selector -->
                <div id="quality-selector" class="quality-selector" style="display: none;">
                    <button class="quality-btn" id="quality-current-btn">
                        <i class="fas fa-gear"></i>
                        <span id="current-quality-label">Auto</span>
                    </button>
                    <div class="quality-menu" id="quality-menu">
                        <!-- Levels will be injected here -->
                    </div>
                </div>
            </div>
            
            <!-- Video Toolbar -->
            <div class="video-toolbar">
                <button class="toolbar-btn" id="lights-btn" title="Tắt đèn">
                    <i class="fas fa-lightbulb"></i>
                    <span>Tắt đèn</span>
                </button>
                <button class="toolbar-btn" id="favorite-btn" title="Yêu thích">
                    <i class="far fa-heart"></i>
                    <span>Yêu thích</span>
                </button>
                <button class="toolbar-btn" id="share-btn" title="Chia sẻ">
                    <i class="fas fa-share-alt"></i>
                    <span>Chia sẻ</span>
                </button>
            </div>
        </section>

        <!-- Content Wrapper -->
        <div class="content-wrapper">
            <!-- Main Column -->
            <div class="main-column">
                <!-- Compact Movie Info -->
                <section class="movie-info-compact">
                    <img id="movie-poster" class="poster-small" src="https://placehold.co/100x150/1a1c26/666?text=Loading" alt="Poster">
                    <div class="info-wrapper">
                        <h1 id="movie-title" class="movie-title">Đang tải...</h1>
                        <h2 id="movie-subtitle" class="movie-subtitle">Loading...</h2>
                        
                        <div class="movie-meta-badges">
                            <span class="meta-tag imdb">IMDb <b id="imdb-score">N/A</b></span>
                            <span class="meta-tag box">T13</span>
                            <span class="meta-tag box" id="year">2024</span>
                            <span class="meta-tag box" id="season-info">Phần 1</span>
                            <span class="meta-tag box" id="episode-info">Tập ??</span>
                        </div>

                        <div id="movie-genres" class="genres-inline"></div>
                        
                        <div class="completion-status">
                            <i class="fas fa-check-circle"></i> 
                            <span id="status-text">Đang cập nhật</span>
                        </div>
                    </div>
                </section>

                <!-- Episodes Section -->
                <div class="section-header-row">
                    <h3 class="section-title"><i class="fas fa-film"></i> Các bản chiếu</h3>
                </div>

                <div id="episodes-section" class="mb-4">
                    <!-- Episodes Control Bar -->
                    <div class="episodes-controls">
                        <div class="left-controls">
                            <div class="season-selector custom-dropdown">
                                <button class="dropdown-btn" onclick="toggleSeasonDropdown()">
                                    <i class="fas fa-layer-group"></i> <span id="current-season-text">Phần 1</span> <i class="fas fa-caret-down"></i>
                                </button>
                                <div class="dropdown-content" id="season-dropdown-content">
                                    <div class="dropdown-header">Danh sách phần</div>
                                    <div id="season-list">
                                        <!-- Dynamic Seasons -->
                                        <a href="#" class="season-item active">Phần 1</a>
                                    </div>
                                </div>
                            </div>
                            <div class="divider-vertical"></div>
                            <div class="server-tabs" id="server-tabs">
                                <!-- Dynamic Server Buttons -->
                            </div>
                        </div>
                    </div>

                    <div id="episodes-grid" class="episodes-grid-new compact"></div>
                
                </div>

                <!-- Comments Section (Always visible) -->
                <div id="comments-section">
                    <div class="comments-section-rich">
                        <!-- Comment Header Tabs -->
                        <div class="comment-header-tabs">
                            <div class="left-tabs">
                                <button class="cmt-tab-btn active"><i class="fas fa-comment-alt"></i> Bình luận ( <span id="comment-count-display">8</span> )</button>
                                <div class="toggle-pill">
                                    <button class="pill-btn active">Bình luận</button>
                                    <button class="pill-btn">Đánh giá</button>
                                </div>
                            </div>
                        </div>

                        <p class="login-prompt">Vui lòng <span class="highlight">đăng nhập</span> để tham gia bình luận.</p>

                        <!-- Comment Form -->
                        <div class="rich-comment-form">
                            <textarea placeholder="Viết bình luận..." rows="3"></textarea>
                            <div class="form-actions">
                                <div class="left-action">
                                    <label class="spoiler-toggle">
                                        <input type="checkbox">
                                        <span class="slider"></span>
                                        <span class="label-text">Tiết lộ?</span>
                                    </label>
                                </div>
                                <div class="right-action">
                                    <span class="char-count">0 / 1000</span>
                                    <button class="send-btn"><i class="fas fa-paper-plane"></i> Gửi</button>
                                </div>
                            </div>
                        </div>

                        <!-- Comment List -->
                        <div class="rich-comment-list" id="rich-comment-list">
                            <!-- Comments will be injected via JS -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sidebar -->
            <aside class="sidebar">
                <!-- Interaction Widget -->
                <div class="sidebar-widget interaction-widget" style="padding: 0; background: transparent; margin-bottom: 20px;">
                    <div class="action-row" style="width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: rgba(255,255,255,0.03); padding: 12px 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);">
                        
                        <!-- Rate Action -->
                        <div class="action-item" id="btn-rate-action" style="text-align: center; cursor: pointer; color: #fff;">
                            <i class="fas fa-star" style="font-size: 20px; display: block; margin-bottom: 5px; transition: color 0.3s;"></i>
                            <span style="font-size: 11px; color: #aaa;">Đánh giá</span>
                        </div>

                        <!-- Comment Action -->
                        <div class="action-item" id="btn-comment-scroll" style="text-align: center; cursor: pointer; color: #fff;">
                            <i class="fas fa-comment-dots" style="font-size: 20px; display: block; margin-bottom: 5px; transition: color 0.3s;"></i>
                            <span style="font-size: 11px; color: #aaa;">Bình luận</span>
                        </div>
                        
                        <!-- Premium Rating Box -->
                        <div class="rating-box-premium" title="Điểm TMDB">
                            <img src="./assets/images/logos/ro-icon.svg" alt="Icon">
                            <span class="rating-score" id="sidebar-rating">--</span>
                            <span class="rating-label">Đánh giá</span>
                        </div>
                    </div>
                </div>

                <!-- Cast Section -->
                <div class="sidebar-widget cast-widget">
                    <h3 class="widget-title">Diễn viên</h3>
                    <div id="cast-grid" class="cast-grid"></div>
                </div>

                <!-- Recommendations -->
                <div class="sidebar-widget">
                    <h3 class="widget-title">Đề xuất cho bạn</h3>
                    <div id="recommendations-list" class="recommendations-list"></div>
                </div>
            </aside>
        </div>
    </main>

    <!-- Footer Component -->
    <div id="footer-placeholder"></div>

    <!-- Core Scripts - Load in correct order -->
    <script src="./js/config.js?v=3"></script>
    <script src="./js/utils.js?v=3"></script>
    <script src="./js/api.js?v=3"></script>
    <script src="./js/main.js?v=3"></script>
    <script src="./js/components.js?v=3"></script>
    <script src="./js/watch.js?v=3" defer></script>
</body>
</html>
