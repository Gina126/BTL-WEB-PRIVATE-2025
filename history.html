<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lịch sử xem | Rophim</title>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- CSS -->
  <link rel="stylesheet" href="./css/variables.css" />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/components.css" />

  <!-- JS -->
  <script src="./js/components.js"></script>
  <script src="./js/config.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/main.js" defer></script>
</head>

<body>

  <!-- Header -->
  <div id="header-placeholder"></div>

  <!-- Main -->
  <main style="padding-top: 90px; max-width: 1692px; margin: 0 auto;">
    <section class="mt-3 mb-4">

      <h2 class="section-title">
        <i class="fa-solid fa-clock-rotate-left"></i>
        Lịch sử xem
      </h2>

      <div class="movies-grid" id="history-grid">

        <!-- History item -->
        <div class="movie-card">

          <!-- Badges -->
          <div class="movie-badges">
            <span class="badge badge-episode">Đã xem Tập 7</span>
            <span class="badge badge-subbed">Vietsub</span>
          </div>

          <!-- Remove history -->
          <button class="btn-favorite" title="Xoá khỏi lịch sử">
            <i class="fa-solid fa-trash"></i>
          </button>

          <!-- Poster -->
          <div class="movie-poster">
            <img
              src="https://image.tmdb.org/t/p/w500/9PFonBhy4cQy7Jz20NpMygczOkv.jpg"
              alt="Moving"
            >
            <div class="poster-overlay">
              <div class="play-icon">
                <i class="fa-solid fa-play"></i>
              </div>
            </div>
          </div>

          <!-- Info -->
          <div class="movie-info">
            <h3 class="movie-title">Moving</h3>
            <p class="movie-origin-name">무빙</p>

            <div class="movie-meta">
              <span>Xem lần cuối: 25/01/2026</span>
            </div>
          </div>

        </div>
        <!-- END history item -->

        <!-- History item -->
        <div class="movie-card">

          <div class="movie-badges">
            <span class="badge badge-episode">Đã xem 45%</span>
            <span class="badge badge-subbed">Vietsub</span>
          </div>

          <button class="btn-favorite" title="Xoá khỏi lịch sử">
            <i class="fa-solid fa-trash"></i>
          </button>

          <div class="movie-poster">
            <img
              src="https://image.tmdb.org/t/p/w500/q719jXXEzOoYaps6babgKnONONX.jpg"
              alt="Avengers"
            >
            <div class="poster-overlay">
              <div class="play-icon">
                <i class="fa-solid fa-play"></i>
              </div>
            </div>
          </div>

          <div class="movie-info">
            <h3 class="movie-title">Avengers: Endgame</h3>
            <p class="movie-origin-name">Avengers: Endgame</p>

            <div class="movie-meta">
              <span>Xem lần cuối: 20/01/2026</span>
            </div>
          </div>

        </div>
        <!-- END history item -->

      </div>
    </section>
  </main>

  <!-- Footer -->
  <div id="footer-placeholder"></div>

</body>
</html>
