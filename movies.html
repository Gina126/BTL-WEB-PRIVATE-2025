<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phim lẻ | Rophim</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="./css/variables.css" />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/components.css" />

  <script src="./js/components.js"></script>
  <script src="./js/config.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/main.js"></script>
</head>

<body>
  <!-- Header -->
  <div id="header-placeholder"></div>

  <!-- Main -->
  <main style="padding-top: 90px; max-width: 1692px; margin: 0 auto;">
    <section class="mt-3 mb-4">
      <h2 class="section-title">
        <i class="fa-solid fa-film"></i>
        Phim lẻ
      </h2>

      <div class="movies-grid">

        <!-- Movie card -->
        <div class="movie-card">
          <div class="movie-badges">
            <span class="badge badge-quality">HD</span>
            <span class="badge badge-subbed">Vietsub</span>
          </div>

          <button class="btn-favorite">
            <i class="fa-regular fa-heart"></i>
          </button>

          <div class="movie-poster">
            <img src="https://image.tmdb.org/t/p/w500/5GA3vV1aWWHTSDO5eno8V5zDo8r.jpg" alt="Oppenheimer">
            <div class="poster-overlay">
              <div class="play-icon">
                <i class="fa-solid fa-play"></i>
              </div>
            </div>
          </div>

          <div class="movie-info">
            <h3 class="movie-title">Oppenheimer</h3>
            <p class="movie-origin-name">Oppenheimer</p>
            <div class="movie-meta">
              <span>2023</span>
              <span>180 phút</span>
              <span>IMDB 8.6</span>
            </div>
          </div>
        </div>

        <!-- Copy card để thêm phim -->
        <!-- END -->

      </div>
    </section>
  </main>

  <!-- Footer -->
  <div id="footer-placeholder"></div>
</body>
</html>
