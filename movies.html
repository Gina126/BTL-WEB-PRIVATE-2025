<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phim lẻ | Rophim</title>

    <!-- Fonts & Icons -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/components.css" />

    <!-- JS -->
    <script src="./js/components.js"></script>
    <script src="./js/config.js"></script>
    <script src="./js/utils.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/movies.js" defer></script>
    <script src="./js/main.js"></script>
  </head>

  <body>
    <!-- Header -->
    <div id="header-placeholder"></div>

    <!-- Main -->
    <main style="padding-top: 90px; max-width: 1692px; margin: 0 auto">
      <section class="mt-3 mb-4">
        <h2 class="section-title">
          <i class="fa-solid fa-film"></i>
          Phim lẻ
        </h2>

        <div class="movies-grid" id="movies-grid">
          <div class="movie-card">
            <div class="movie-badges">
              <span class="badge badge-quality">HD</span>
              <span class="badge badge-subbed">Vietsub</span>
            </div>

            <!-- Favorite -->
            <button class="btn-favorite">
              <i class="fa-regular fa-heart"></i>
            </button>

            <!-- Poster -->
            <div class="movie-poster">
              <img
                src="https://image.tmdb.org/t/p/w500/9PFonBhy4cQy7Jz20NpMygczOkv.jpg"
                alt="Movie title"
              />
              <div class="poster-overlay">
                <div class="play-icon">
                  <i class="fa-solid fa-play"></i>
                </div>
              </div>
            </div>

            <!-- Info -->
            <div class="movie-info">
              <h3 class="movie-title">Movie title</h3>
              <p class="movie-origin-name">Original name</p>

              <div class="movie-meta">
                <span>2024</span>
                <span>120 phút</span>
                <span>IMDB 8.2</span>
              </div>
            </div>
          </div>
        </div>

        <div class="pagination">
          <button class="page-btn" id="firstPage" title="Về trang đầu">
            <i class="fa-solid fa-angles-left"></i>
          </button>

          <button class="page-btn" id="prevPage" title="Trang trước">
            <i class="fa-solid fa-angle-left"></i>
          </button>

          <span class="page-info">
            Trang <strong id="currentPage">1</strong> /
            <strong id="totalPage">1</strong>
          </span>

          <button class="page-btn" id="nextPage" title="Trang sau">
            <i class="fa-solid fa-angle-right"></i>
          </button>

          <button class="page-btn" id="lastPage" title="Về trang cuối">
            <i class="fa-solid fa-angles-right"></i>
          </button>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <div id="footer-placeholder"></div>
  </body>
</html>
